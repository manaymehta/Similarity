services:
  # 1. client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Maps localhost:3000 to container:80 (Nginx)
    depends_on:
      - server
    networks:
      - app-network

  # 2. server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI} # from the .env
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ML_SERVICE_URL=http://ml-service:5001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - chromadb
      - ml-service
      - redis
    networks:
      - app-network

  # 3. ml_service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    networks:
      - app-network

  # 4. MongoDB 
  # Using MongoDB Cloud instead of local container.

  # 5. ChromaDB
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index
    networks:
      - app-network

  # 6. Redis (Result Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  chroma_data:
  redis_data:
